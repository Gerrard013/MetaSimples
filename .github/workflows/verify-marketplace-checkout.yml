name: MetaSimples — verify Mercado Pago and G Tech bridge
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m compileall -q app.py routes services models tests
      - name: Run isolated checkout tests without network
        run: python -m unittest discover -s tests -v
